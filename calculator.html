<!DOCTYPE html><html>
<head>
<title>Calculator</title>
<style>
body{
font-family:Arial;
background:#eef2ff;
text-align:center;
padding:40px;
}
.box{
background:white;
padding:30px;
max-width:500px;
margin:auto;
border-radius:15px;
box-shadow:0 0 15px gray;
}
input{
padding:10px;
margin:10px;
width:150px;
}
button{
padding:10px 15px;
margin:5px;
cursor:pointer;
}
#result{
font-size:24px;
color:#0066cc;
margin-top:20px;
}
</style>
</head>
<body><div class="box"><h1>Calculator</h1><input type="number" id="a" placeholder="First Number"><br>
<input type="number" id="b" placeholder="Second Number"><br>

<button onclick="add()">Add</button>
<button onclick="sub()">Subtract</button>
<button onclick="mul()">Multiply</button>
<button onclick="div()">Divide</button>

<h2 id="result"></h2><script>
function add(){
let a=Number(document.getElementById('a').value);
let b=Number(document.getElementById('b').value);
document.getElementById('result').innerHTML="Answer = "+(a+b);
}
function sub(){
let a=Number(document.getElementById('a').value);
let b=Number(document.getElementById('b').value);
document.getElementById('result').innerHTML="Answer = "+(a-b);
}
function mul(){
let a=Number(document.getElementById('a').value);
let b=Number(document.getElementById('b').value);
document.getElementById('result').innerHTML="Answer = "+(a*b);
}
function div(){
let a=Number(document.getElementById('a').value);
let b=Number(document.getElementById('b').value);
document.getElementById('result').innerHTML="Answer = "+(a/b);
}
</script><br><br>

<a href="index.html">Back Home</a>

</div></body>
</html>
